name: Build webOS Homebrew package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'webosbrew/apps.json'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or ref to package
        required: false
        default: agent/webos-enhanced-phase-1

permissions:
  contents: write

concurrency:
  group: webos-homebrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}
      RELEASE_TAG: webos-latest

    steps:
      - name: Checkout Enhanced source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build IPK
        run: npm run package:webos

      - name: Resolve immutable package name
        id: pkg
        shell: bash
        run: |
          VERSION="$(node -p "require('./appinfo.json').version")"
          SOURCE="$(find . -maxdepth 1 -type f -name 'space.nuvio.webos_*_all.ipk' | head -n 1)"
          test -n "$SOURCE"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TARGET="NuvioWeb-Enhanced-webOS-${VERSION}-${SHORT_SHA}.ipk"
          mv "$SOURCE" "$TARGET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipk=$TARGET" >> "$GITHUB_OUTPUT"
          echo "filename=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Publish immutable prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          IPK: ${{ steps.pkg.outputs.ipk }}
          VERSION: ${{ steps.pkg.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$IPK"; then
              gh release upload "$RELEASE_TAG" "$IPK" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio TV Enhanced webOS ${VERSION}" \
              --notes "Automatic LG webOS Enhanced development build." \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "$IPK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "Nuvio TV Enhanced webOS ${VERSION}" \
              --notes "Automatic LG webOS Enhanced development build." \
              --prerelease
          fi

      - name: Checkout main for Homebrew metadata
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          fetch-depth: 0

      - name: Generate Homebrew repository manifest
        env:
          RELEASE_TAG: webos-latest
        shell: bash
        run: |
          node publish/scripts/generate-webosbrew.mjs "${{ steps.pkg.outputs.ipk }}"
          mkdir -p publish/webosbrew
          cp webosbrew/apps.json publish/webosbrew/apps.json

      - name: Commit Homebrew manifest
        shell: bash
        run: |
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webosbrew/apps.json
          if git diff --cached --quiet; then
            echo "Homebrew manifest unchanged"
            exit 0
          fi
          git commit -m "chore: update webOS Homebrew manifest [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioWeb-Enhanced-webOS-${{ steps.pkg.outputs.version }}-${{ github.run_id }}
          path: ${{ steps.pkg.outputs.ipk }}
          if-no-files-found: error
